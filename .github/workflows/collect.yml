name: Collect news

on:
  schedule:
    # 21:07 UTC = 06:07 JST
    - cron: '7 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect
        run: python3 scripts/collect_news.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "news: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
